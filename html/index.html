<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>XS-TaxiJob</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="terminal" class="hidden">
    <div class="panel shell">
        <nav class="rail">
            <div class="rail-brand">
                <span class="lamp"></span>
                <h1>Downtown Cab Co.</h1>
                <p id="driver-line">Driver terminal</p>
            </div>

            <button class="tab rail-item active" data-tab="shift">
                <span class="n">Shift</span>
                <span class="pill on" id="rail-duty" hidden>On</span>
            </button>
            <button class="tab rail-item" data-tab="vehicles"><span class="n">Cabs</span></button>
            <button class="tab rail-item" data-tab="stats"><span class="n">Record</span></button>
            <button class="tab rail-item" data-tab="leaderboard"><span class="n">Board</span></button>
            <button class="tab rail-item admin-tab hidden" data-tab="admin"><span class="n">Admin</span></button>
        </nav>

        <div class="screen">
            <div class="screen-head">
                <span class="screen-title" id="screen-title">Shift</span>
                <button id="close" type="button" class="ghost">Close</button>
            </div>
            <main id="panel"></main>
        </div>
    </div>
</div>

<!-- One corner, one order: calls, then the receipt, then the meter. -->
<div id="dock">

    <div id="hails"></div>

    <div id="summary" class="hidden">
        <div class="summary-card">
            <h2>Fare complete</h2>
            <div class="summary-rows" id="summary-rows"></div>
            <button id="summary-close" type="button">Clear</button>
        </div>
    </div>

    <!-- A fixed-size unit. It never resizes between states: a box in the
         corner of your eye that grows and shrinks while you drive is what
         makes a HUD read as a web page rather than as equipment. -->
    <div id="meter" class="hidden">
        <div class="mtr-head">
            <span class="dot"></span>
            <span class="mtr-state" id="meter-title">Off duty</span>
            <span class="mtr-flags">
                <span class="pill" id="meter-tariff" hidden></span>
                <span class="mtr-pips" id="meter-pips"></span>
                <span id="meter-vehicle"></span>
            </span>
        </div>

        <div class="mtr-read" id="meter-well">
            <div class="mtr-big" id="meter-amount">$0</div>
            <div class="mtr-cap" id="meter-cap">Shift</div>
            <div class="mtr-aux">
                <b id="meter-distance">0m</b>
                <b id="meter-time">0:00</b>
            </div>
        </div>

        <div class="mtr-route">
            <span class="mtr-to" id="meter-route"></span>
            <span class="mtr-eta" id="meter-totals"></span>
        </div>
    </div>

</div>

<script src="js/app.js"></script>
<script src="js/meter.js"></script>
<script src="js/panels/shift.js"></script>
<script src="js/panels/vehicles.js"></script>
<script src="js/panels/stats.js"></script>
<script src="js/panels/leaderboard.js"></script>
<script src="js/panels/admin.js"></script>

</body>
</html>
